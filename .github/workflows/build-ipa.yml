name: Build Unsigned IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned archive
        run: |
          xcodebuild -project AutoDropKeyboard.xcodeproj \
            -scheme AutoDropHost \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/AutoDropHost.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          rm -rf Payload AutoDropKeyboard.ipa
          mkdir -p Payload
          cp -R build/AutoDropHost.xcarchive/Products/Applications/AutoDropHost.app Payload/
          zip -qry AutoDropKeyboard.ipa Payload
          rm -rf Payload

      - name: Upload AutoDropKeyboard.ipa
        uses: actions/upload-artifact@v4
        with:
          name: AutoDropKeyboard-ipa
          path: AutoDropKeyboard.ipa
          if-no-files-found: error
